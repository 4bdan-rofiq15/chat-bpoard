<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Chat Realtime</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }

.container { width: 100%; max-width: 450px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
.hidden { display: none !important; }

/* Form Login */
#login-screen { justify-content: center; padding: 20px; height: auto; }
#login-screen h2 { text-align: center; margin-bottom: 20px; }
#login-screen input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
#login-screen button { width: 100%; padding: 12px; background: #075e54; color: white; border: none; border-radius: 4px; cursor: pointer; }
.error { color: red; font-size: 14px; margin-top: 10px; text-align: center; }

/* Area Chat */
.chat-header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
.chat-header button { background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
.chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 10px; }

/* Bubble Pesan */
.message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; word-wrap: break-word; }
.message.sent { background: #dcf8c6; align-self: flex-end; }
.message.received { background: white; align-self: flex-start; }
.message .sender { font-size: 11px; font-weight: bold; color: #555; margin-bottom: 3px; display: block; }
.message .time { font-size: 10px; color: #888; text-align: right; margin-top: 4px; display: block; }

/* Input Pesan */
.chat-input-area { display: flex; padding: 10px; background: #f0f0f0; }
.chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
.chat-input-area button { margin-left: 8px; padding: 10px 18px; background: #128c7e; color: white; border: none; border-radius: 20px; cursor: pointer; }
</style>
<body>

  <!-- 1. Tampilan Login -->
  <div id="login-screen" class="container">
    <h2>Login Web Chat</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email Akun" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Masuk</button>
      <p id="error-msg" class="error"></p>
    </form>
  </div>

  <!-- 2. Tampilan Chat -->
  <div id="chat-screen" class="container hidden">
    <header class="chat-header">
      <span id="user-display"></span>
      <button id="logout-btn">Keluar</button>
    </header>
    
    <div id="chat-box" class="chat-box">
      <!-- Pesan-pesan akan muncul di sini secara otomatis -->
    </div>

    <form id="chat-form" class="chat-input-area">
      <input type="text" id="message-input" placeholder="Tulis pesan..." autocomplete="off" required>
      <button type="submit">Kirim</button>
    </form>
  </div>

  <!-- Script JS Firebase & logika utama -->
  <script type="module"> 
    // Import fungsi-fungsi Firebase dari CDN (ES Modules)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  onAuthStateChanged, 
  signOut 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  query, 
  orderBy, 
  onSnapshot, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Konfigurasi Firebase Anda (Ganti dengan config dari project Firebase Anda)
const firebaseConfig = {
  apiKey: "AIzaSyAJiVzuZKFwjST8-rfyqKHQ4nQcjv5e_YI",
  authDomain: "chat-live-4d820.firebaseapp.com",
  projectId: "chat-live-4d820",
  storageBucket: "chat-live-4d820.firebasestorage.app",
  messagingSenderId: "971209644086",
  appId: "1:971209644086:web:5523c52ba13921d9b22097",
  measurementId: "G-V5MZTVK4TN"
};

// Inisialisasi Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Elemen DOM
const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const loginForm = document.getElementById('login-form');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const errorMsg = document.getElementById('error-msg');
const userDisplay = document.getElementById('user-display');
const logoutBtn = document.getElementById('logout-btn');
const chatForm = document.getElementById('chat-form');
const messageInput = document.getElementById('message-input');
const chatBox = document.getElementById('chat-box');

let currentUser = null;

// 1. Cek Status Login Pengguna
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    userDisplay.textContent = user.email;
    loginScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    loadMessages(); // Muat pesan saat login
  } else {
    currentUser = null;
    loginScreen.classList.remove('hidden');
    chatScreen.classList.add('hidden');
  }
});

// 2. Fitur Login dengan Akun Terdaftar
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.textContent = '';
  
  try {
    await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
    loginForm.reset();
  } catch (error) {
    errorMsg.textContent = 'Login gagal: Email atau Password salah.';
  }
});

// 3. Fitur Logout
logoutBtn.addEventListener('click', () => {
  signOut(auth);
});

// 4. Fitur Kirim Pesan
chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (!text) return;

  try {
    await addDoc(collection(db, "messages"), {
      text: text,
      sender: currentUser.email,
      timestamp: serverTimestamp()
    });
    messageInput.value = '';
  } catch (error) {
    console.error("Gagal mengirim pesan: ", error);
  }
});

// 5. Fitur BACA PESAN REALTIME
function loadMessages() {
  const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));

  // onSnapshot mendengarkan perubahan database secara langsung/real-time
  onSnapshot(q, (snapshot) => {
    chatBox.innerHTML = ''; // Clear chatbox
    
    snapshot.forEach((doc) => {
      const msg = doc.data();
      const isSentByMe = msg.sender === currentUser.email;

      const messageElement = document.createElement('div');
      messageElement.classList.add('message', isSentByMe ? 'sent' : 'received');

      const senderElement = document.createElement('span');
      senderElement.classList.add('sender');
      senderElement.textContent = isSentByMe ? 'Anda' : msg.sender;

      const textElement = document.createElement('span');
      textElement.textContent = msg.text;

      messageElement.appendChild(senderElement);
      messageElement.appendChild(textElement);
      chatBox.appendChild(messageElement);
    });

    // Otomatis scroll ke paling bawah setiap ada pesan baru
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}
  </script>
</body>
</html>
